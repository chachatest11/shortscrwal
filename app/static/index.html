<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>ChannelBoard · YouTube 다채널 대시보드</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
    <script>
        // 첫 화면 깜빡임 방지: 저장된 테마를 그리기 전에 적용
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('cb:theme') || 'system'; } catch (e) {}
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/static/css/tokens.css?v=1.0.0">
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.0">
    <link rel="stylesheet" href="/static/css/components.css?v=1.0.0">
    <link rel="stylesheet" href="/static/css/views.css?v=1.0.0">
</head>
<body>
    <div class="app-shell" id="app">
        <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M12 9l11 7-11 7z" fill="#fff"/></svg>
                </span>
                <span class="brand-text">
                    <span class="brand-name">ChannelBoard</span>
                    <span class="brand-sub">YouTube 다채널 대시보드</span>
                </span>
            </div>
            <nav class="nav" id="nav"></nav>
            <div class="sidebar-footer">
                <div class="quota-card" id="quotaCard">
                    <div class="quota-title">오늘 API 쿼터</div>
                    <div class="quota-value"><b id="quotaUsed">–</b> <span class="muted">/ <span id="quotaTotal">10,000</span> units</span></div>
                    <div class="meter" aria-hidden="true"><div class="meter-fill" id="quotaFill" style="width:0%"></div></div>
                    <div class="quota-next muted" id="quotaNext"></div>
                </div>
                <button class="theme-toggle" id="themeToggle" type="button" title="테마 전환"></button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기"></button>
                <div class="topbar-title">
                    <h1 id="pageTitle">대시보드</h1>
                    <span class="topbar-sub" id="pageSub"></span>
                </div>
                <div class="topbar-actions">
                    <span class="last-refresh" id="lastRefresh"></span>
                    <button class="btn btn-primary" id="refreshBtn" type="button"></button>
                </div>
            </header>
            <div class="progress-line" id="progressLine" hidden><div class="progress-line-fill" id="progressFill"></div></div>
            <main class="content" id="view"></main>
        </div>
    </div>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <script src="/static/vendor/chartjs/chart.umd.js"></script>
    <script type="module" src="/static/js/app.js?v=1.0.0"></script>
</body>
</html>
